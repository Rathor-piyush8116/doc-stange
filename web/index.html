<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doctor Strange Hand Gesture Filter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- MediaPipe dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Camera feed (mirrored to canvas) -->
    <video id="webcam" playsinline muted></video>

    <!-- Main Fullscreen Canvas -->
    <canvas id="render-canvas"></canvas>

    <!-- Ambient Spell Glow -->
    <div id="ambient-glow" class="ambient-glow"></div>

    <!-- Minimalist Status Indicator -->
    <div class="hud-status">
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span id="gesture-text">MANUAL MODE (Eldritch Orange)</span>
      </div>
    </div>

    <!-- Controls Helper Bar -->
    <div class="hud-controls">
      <div class="key-hint"><kbd>Click / Space</kbd> Toggle Shield</div>
      <div class="key-hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Styles</div>
      <div class="key-hint"><kbd>Scroll / +/-</kbd> Resize</div>
      <div class="key-hint"><kbd>S</kbd> Sparks</div>
      <div class="key-hint"><kbd>M</kbd> Mode</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
